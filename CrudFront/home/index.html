<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>GO CRUD</title>
  </head>
  <body>
    <div class="crud">
      <div class="head">
        <h1>GO crud</h1>
        <p>product management system</p>
      </div>
      <div class="userCard">
        <div class="avatar" id="userAvatar"></div>
        <div class="info">
          <p class="userNameRow" id="userName"></p>
          <p>Email: <span id="userEmail"></span></p>
          <p>Joined: <span id="userJoined"></span></p>
        </div>
        <button id="logoutBtn">Logout</button>
      </div>
      <div class="input">
        <input type="text" id="title" placeholder="title" />
        <div class="price">
          <input
            onkeyup="getTotal()"
            type="number"
            id="price"
            placeholder="price"
          />
          <input
            onkeyup="getTotal()"
            type="number"
            id="taxes"
            placeholder="taxes"
          />
          <input
            onkeyup="getTotal()"
            type="number"
            id="ads"
            placeholder="ads"
          />
          <input
            onkeyup="getTotal()"
            type="number"
            id="discount"
            placeholder="discount"
          />
          <small id="total"></small>
        </div>

        <input type="number" id="count" placeholder="count" />
        <input type="text" id="category" placeholder="category" />
        <button id="submit">create</button>
      </div>

      <div class="output">
        <div class="searchbox">
          <input
            onkeyup="searchinput(this.value)"
            type="text"
            id="search"
            placeholder="search"
          />
          <div class="btnbox">
            <button onclick="getsearchmode(this.id)" id="searchtitle">
              Search by title
            </button>
            <button onclick="getsearchmode(this.id)" id="searchcategory">
              Search by category
            </button>
          </div>
        </div>

        <!-- delete all button -->
        <div id="deleteAll"></div>
        <div class="tableContainer">
          <table>
            <tr>
              <th>id</th>
              <th>title</th>
              <th>price</th>
              <th>taxes</th>
              <th>ads</th>
              <th>discount</th>
              <th>total</th>
              <th>quantity</th>
              <th>category</th>
              <th>update</th>
              <th>delete</th>
            </tr>

            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div id="confirmDeleteBox" class="confirmDeleteOverlay">
      <div class="confirmDeleteBox">
        <p>are you sure to delete all of your products?</p>
        <input
          type="password"
          id="deletePasswordInput"
          placeholder="Enter your password to delete all"
        />
        <p id="deleteError" class="error-message"></p>
        <div class="confirmDeleteButtons">
          <button id="confirmDeleteBtn">confirm</button>
          <button id="cancelDeleteBtn">cancel</button>
        </div>
      </div>
    </div>
    <script src="crud.js"></script>
  </body>
</html>
